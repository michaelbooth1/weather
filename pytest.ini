[pytest]
# Collect only the real unit tests. scratch/ holds ad-hoc live scripts named
# test_*.py that hit the network and are not part of the suite.
testpaths = tests
pythonpath = src
# Delete a passing test's tmp_path at teardown: the clone-heavy operations tests otherwise hold
# ~7 GiB until the chunk ends and trip the bounded suite's 50 GiB disk floor (2026-09-25).
tmp_path_retention_policy = failed
# Staged test cuts: see tests/quarantine_plugin.py and docs/development.md.
# CI partitions the Linux suite by marker: `-m ratchet <files>` in the fast audit job,
# `-m "not ratchet and not memory_flatness"` in the `test` job and
# `-m "memory_flatness and not ratchet"` in the parallel `memory-flatness` job;
# tests/operations/test_ci_job_partition.py and test_ci_ratchet_selection.py prove it.
markers =
    quarantine(reason, added, sunset, replaced_by=None): staged cut; the test still runs but a failure is reported as a non-fatal xfail; needs an entry in tests/quarantine_registry.json (see docs/development.md)
    ratchet: repository-wide architecture or inventory ratchet; CI runs it once, in the fast audit job (see .github/workflows/ci.yml)
    windows_native: ratchet that executes only on Windows; CI runs it once, in one Windows qualification shard (see tests/operations/test_ci_ratchet_selection.py)
    memory_flatness: slow 5-to-50-run tracemalloc flatness check; CI runs it once, in the parallel memory-flatness job (see .github/workflows/ci.yml)
