[pytest]
# Collect only the real unit tests. scratch/ holds ad-hoc live scripts named
# test_*.py that hit the network and are not part of the suite.
testpaths = tests
pythonpath = src
# Delete a passing test's tmp_path at teardown: the clone-heavy operations tests otherwise hold
# ~7 GiB until the chunk ends and trip the bounded suite's 50 GiB disk floor (2026-09-25).
tmp_path_retention_policy = failed
# Cost marker for tests that start git or PowerShell processes (test-suite review K, owner decision
# 2026-10-04); tests/hygiene_ratchet.py blocks new unmarked ones. `serial` marks a file that must not run
# under xdist and is never part of the workstation focused-run exemption (HOST_LOAD_POLICY.md).
markers =
    spawns: starts git or PowerShell child processes (cost marker; deselect with -m "not spawns" for a fast loop)
    serial: must run in one process, never under xdist; a file containing one is not focused-run exempt
