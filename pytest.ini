[pytest]
# Collect only the real unit tests. scratch/ holds ad-hoc live scripts named
# test_*.py that hit the network and are not part of the suite.
testpaths = tests
pythonpath = src
# Delete a passing test's tmp_path at teardown: the clone-heavy operations tests otherwise hold
# ~7 GiB until the chunk ends and trip the bounded suite's 50 GiB disk floor (2026-09-25).
tmp_path_retention_policy = failed
