name: Qualification checkout attribution

on:
  pull_request:
    paths:
      - '.github/workflows/qualification-checkout-diagnostic.yml'
      - '.github/qualification_checkout_trace.py'

permissions:
  contents: read

jobs:
  focused:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      WEATHER_INTEGRATION_TEST_OFFLINE: '1'
      WEATHER_INTEGRATION_TEST_SECRET_POLICY: conservative_v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.0'
          architecture: x64
      - run: python -m pip install -r requirements.txt -e '.[test,live]'
      - name: Attribute the native checkout write
        shell: bash
        run: |
          set -euo pipefail
          python .github/qualification_checkout_trace.py tests/operations/test_qualification*.py tests/operations/test_schema_registry.py tests/operations/test_import_architecture.py -q --junitxml="$RUNNER_TEMP/qualification-focused.xml" 2>&1 | tee "$RUNNER_TEMP/qualification-focused.log"
      - name: Retain focused attribution immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-checkout-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification-*
          if-no-files-found: error
          retention-days: 14
