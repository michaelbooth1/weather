name: Nightly Candidate Build

on:
  # Daily schedule disabled 2026-07-29. This job duplicated training that the
  # production host now owns (WeatherTrainingWindow, 01:00 local), and its
  # nightly LFS checkout of ~382 MB was the dominant consumer of the account's
  # metered Git LFS bandwidth (~11.5 GB/month against a 1 GB quota).
  # Re-enable deliberately if the hosted candidate build is wanted again.
  #  schedule:
  #    - cron: '0 8 * * *' # 8 AM UTC daily
  workflow_dispatch: # Manual trigger only

permissions:
  contents: read

concurrency:
  group: nightly-candidate-build
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # See ci.yml: LFS checkout is metered. If a manual run of this job
          # genuinely needs model bytes, pull only the artifacts it uses:
          #   git lfs pull --include="artifacts/models/hgb/<name>.pkl"
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[test]"

      - name: Validate Source And Tests
        run: |
          python -m compileall -q app src tests
          python -m pytest -q

      - name: Build Historical Backfill Plan
        run: python -m weather.collection.historical_backfill_plan --out data/backtest/historical_backfill_plan.json

      - name: Run Historical Backfill Runner
        run: python -m weather.collection.historical_backfill_runner run --plan data/backtest/historical_backfill_plan.json

      - name: Train Candidate Artifacts For Both Unit Families
        run: |
          python -m weather.calibration.feature_model --market toronto
          python -m weather.calibration.feature_model --market nyc

      - name: Audit Model Artifacts
        run: |
          python -m weather.artifacts registry
          python -m weather.artifacts size-audit

      - name: Upload Candidate Artifacts For Review
        uses: actions/upload-artifact@v4
        with:
          name: weather-model-candidates-${{ github.run_id }}
          path: |
            artifacts/
            data/backtest/*report.md
            data/backtest/*.json
          if-no-files-found: error
          retention-days: 7
