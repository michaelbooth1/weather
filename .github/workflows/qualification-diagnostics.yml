name: Qualification isolated diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/qualification-diagnostics.yml'
      - 'src/weather/operations/qualification/**'
      - 'tests/operations/test_qualification*.py'
      - 'scripts/ops/qualification*.ps1'

permissions:
  contents: read

concurrency:
  group: qualification-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  isolated:
    name: qualification-isolated-${{ matrix.platform }}-${{ matrix.file }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, linux]
        file: [importer, transport, frozen]
        include:
          - platform: windows
            os: windows-2022
          - platform: linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      WEATHER_INTEGRATION_TEST_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.0'
          architecture: x64
      - run: python -m pip install pytest==9.0.3
      - name: Run one isolated file with native timeout diagnostics
        shell: bash
        env:
          TEST_FILE: ${{ matrix.file }}
        run: |
          set -euo pipefail
          python -u -m pytest "tests/operations/test_qualification_${TEST_FILE}.py" -vv -s -o faulthandler_timeout=10 --durations=0 --junitxml="$RUNNER_TEMP/isolated.xml" 2>&1 | tee "$RUNNER_TEMP/isolated.log"
      - name: Retain isolated evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-isolated-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}-${{ matrix.file }}
          path: ${{ runner.temp }}/isolated.*
          if-no-files-found: error
          retention-days: 14
