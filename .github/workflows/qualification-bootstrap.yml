name: Qualification bootstrap review

on:
  pull_request:
    paths:
      - '.github/workflows/qualification-bootstrap.yml'
      - 'src/weather/operations/qualification/**'
      - 'src/weather/schema_registry*.py'
      - 'scripts/ops/**'
      - 'tests/operations/test_qualification*.py'

# These are development/bootstrap records for direct review. This workflow has
# no signing or production role and cannot emit a code_qualification_v2 PASS.
permissions:
  contents: read

concurrency:
  group: qualification-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native:
    name: qualification-bootstrap-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2022
          - platform: linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      WEATHER_INTEGRATION_TEST_OFFLINE: '1'
      WEATHER_INTEGRATION_TEST_SECRET_POLICY: conservative_v1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.0'
          architecture: x64
      - name: Record exact source and native environment
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/qualification-source.txt"
          python -VV > "$RUNNER_TEMP/qualification-python.txt"
          git --version > "$RUNNER_TEMP/qualification-git.txt"
          git status --porcelain=v1 > "$RUNNER_TEMP/qualification-before.txt"
          test ! -s "$RUNNER_TEMP/qualification-before.txt"
      - name: Install regression dependencies and retain resolution
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --report "$RUNNER_TEMP/qualification-dependencies.json" -r requirements.txt
          python -m pip install --disable-pip-version-check --report "$RUNNER_TEMP/qualification-project.json" -e '.[test]'
          python -m pip freeze --all > "$RUNNER_TEMP/qualification-distributions.txt"
      - name: Native control-plane tests
        run: |
          set -euo pipefail
          python -m pytest tests/operations/test_qualification*.py tests/operations/test_schema_registry.py tests/operations/test_import_architecture.py -q --junitxml="$RUNNER_TEMP/qualification-focused.xml" 2>&1 | tee "$RUNNER_TEMP/qualification-focused.log"
      - name: Repository checks
        run: |
          set -euo pipefail
          python -X pycache_prefix="$RUNNER_TEMP/qualification-compile-cache" -m compileall -q app src tests
          python -m weather.operations.agent_docs_audit 2>&1 | tee "$RUNNER_TEMP/qualification-docs.log"
          python -m weather.reporting.roadmap.roadmap_backlog --fail-on-lint --check 2>&1 | tee "$RUNNER_TEMP/qualification-roadmap.log"
      - name: Complete native regression suite
        env:
          WEATHER_QUALIFICATION_JOURNAL: ${{ runner.temp }}/qualification-full.jsonl
        run: |
          set -euo pipefail
          python -m pytest tests --strict-config --strict-markers -p weather.operations.qualification.pytest_observer -q --junitxml="$RUNNER_TEMP/qualification-full.xml" 2>&1 | tee "$RUNNER_TEMP/qualification-full.log"
      - name: Verify final source identity
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git status --porcelain=v1 > "$RUNNER_TEMP/qualification-after.txt"
          test ! -s "$RUNNER_TEMP/qualification-after.txt"
      - name: Retain exact-attempt development evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/qualification-*
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
