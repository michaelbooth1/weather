name: Reviewed split qualification

on:
  workflow_dispatch:
    inputs:
      source:
        description: Reviewed complete candidate commit SHA
        required: true
        type: string
      preparation_artifact:
        description: Independently reviewed preparation artifact ID
        required: true
        type: string
      preparation_sha256:
        description: Reviewed preparation ZIP SHA256
        required: true
        type: string
      authority:
        description: Reviewed dispatch reference JSON (path, sha256, size)
        required: true
        type: string

# Manual execution at the independently approved producer commit P only.
# A successful workflow is code evidence, never host acceptance or adoption.
permissions:
  contents: read
  actions: read

jobs:
  native:
    name: qualification-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2022
          - platform: linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve Git object bytes on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: producer
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.0'
          architecture: x64
      - name: Execute the complete reviewed native plan
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARATION_ID: ${{ inputs.preparation_artifact }}
          PREPARATION_SHA256: ${{ inputs.preparation_sha256 }}
          AUTHORITY_REFERENCE: ${{ inputs.authority }}
        run: |
          set -euo pipefail
          python -I -S "$GITHUB_WORKSPACE/producer/scripts/ops/qualification_cli.py" job --trusted-root "$GITHUB_WORKSPACE/producer" --candidate "$GITHUB_WORKSPACE/candidate" --root "$RUNNER_TEMP/qualification" --preparation-artifact "$PREPARATION_ID" --preparation-sha256 "$PREPARATION_SHA256" --authority "$AUTHORITY_REFERENCE"
      - name: Retain complete native evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/qualification/export/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
      - name: Retain refused invocation diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-refusal-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/qualification/evidence/**/*.json
            ${{ runner.temp }}/qualification/evidence/**/*.jsonl
            ${{ runner.temp }}/qualification/evidence/**/*.log
            ${{ runner.temp }}/qualification/installation/*.log
          if-no-files-found: ignore
          retention-days: 14

  publisher:
    name: qualification-publisher
    needs: native
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    # This job checks out P only. Candidate source/wheels are never imported.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: producer
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.0'
          architecture: x64
      - name: Authenticate native jobs and seal the evidence graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARATION_ID: ${{ inputs.preparation_artifact }}
          PREPARATION_SHA256: ${{ inputs.preparation_sha256 }}
          AUTHORITY_REFERENCE: ${{ inputs.authority }}
        run: |
          set -euo pipefail
          python -I -S "$GITHUB_WORKSPACE/producer/scripts/ops/qualification_cli.py" publish --trusted-root "$GITHUB_WORKSPACE/producer" --root "$RUNNER_TEMP/qualification" --preparation-artifact "$PREPARATION_ID" --preparation-sha256 "$PREPARATION_SHA256" --authority "$AUTHORITY_REFERENCE"
      - name: Sign the checked code certificate
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/qualification/export/code-certificate.json
          create-storage-record: false
      - name: Retain the native signature bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp -- "$BUNDLE_PATH" "$RUNNER_TEMP/qualification/export/attestation.jsonl"
      - name: Publish the final data-only evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification/export/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
