name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[test]"

      - name: Compile Source
        run: python -m compileall -q app src tests

      - name: Validate Agent Knowledge Contracts
        run: python -m weather.operations.agent_docs_audit

      - name: Run Test Suite
        run: python -m pytest -q
