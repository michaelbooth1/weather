name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Git ancestry is part of the integration contract. A shallow clone
          # can turn a valid ancestor into a false negative.
          fetch-depth: 0
          # Do NOT set lfs: true. The hgb model artifacts are ~382 MB and every
          # checkout of them is metered against the account's LFS bandwidth
          # quota (1 GB/month included); this workflow alone exhausted it.
          # The test suite stubs these artifacts and does not read their bytes.
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[test]"

      - name: Compile Source
        run: python -m compileall -q app src tests

      - name: Validate Agent Knowledge Contracts
        run: python -m weather.operations.agent_docs_audit

      - name: Validate Generated Roadmap Is Current
        run: python -m weather.reporting.roadmap.roadmap_backlog --fail-on-lint --check

      - name: Run Test Suite
        run: python -m pytest -q

  windows-production-contracts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Focused Test Dependency
        run: python -m pip install pytest

      - name: Parse Operations Scripts With Windows PowerShell 5.1
        shell: powershell
        run: |
          $failures = @()
          Get-ChildItem scripts\ops -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failures += "$($_.Name): $($errors -join '; ')"
            }
          }
          if ($failures.Count -gt 0) {
            throw ($failures -join "`n")
          }

      - name: Run Windows Operations Contracts
        shell: powershell
        run: |
          python -m pytest -q `
            tests/operations/test_workload_admission_script.py `
            tests/operations/test_quiet_window_merge_script.py `
            tests/operations/test_host_task_wrappers.py
