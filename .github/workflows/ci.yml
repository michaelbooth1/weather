name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; master runs always finish so every
  # landed commit keeps its own CI evidence.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Fast gate: cheap repository-wide ratchets fail before the long suite
  # starts. Keep it to deterministic audits with no network or fixtures.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # The agent-docs audit checks correspondence history; a shallow
          # clone fails it.
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[test]"

      - name: Compile Source
        run: python -m compileall -q app src tests

      - name: Validate Agent Knowledge Contracts
        run: python -m weather.operations.agent_docs_audit

      - name: Validate Generated Roadmap Is Current
        run: python -m weather.reporting.roadmap.roadmap_backlog --fail-on-lint --check

      # Every test marked `ratchet` runs here and only here: the `test` job
      # deselects the same marker. The file list must name every file that
      # uses the marker; tests/operations/test_ci_ratchet_selection.py proves
      # both rules, so each ratchet runs exactly once per CI run.
      - name: Architecture and Inventory Ratchets
        run: >-
          python -m pytest -q -p no:cacheprovider -m ratchet
          tests/app/test_app_architecture.py
          tests/market/test_wallet_reader.py
          tests/operations/test_agent_docs_audit.py
          tests/operations/test_ci_ratchet_selection.py
          tests/operations/test_cold_recovery_host_guard.py
          tests/operations/test_dependency_pins.py
          tests/operations/test_host_task_wrappers.py
          tests/operations/test_import_architecture.py
          tests/operations/test_knowledge_structure_audit.py
          tests/operations/test_memory_commit_guard_script.py
          tests/operations/test_module_size_audit.py
          tests/operations/test_no_tracked_credentials.py
          tests/operations/test_operating_reference.py
          tests/operations/test_ops_script_ratchets.py
          tests/operations/test_path_policy.py
          tests/operations/test_python_runtime_audit.py
          tests/operations/test_release_import_boundary.py
          tests/operations/test_research_harness.py
          tests/operations/test_runtime_utilities.py
          tests/operations/test_schema_registry.py
          tests/operations/test_structure_inventory.py
          tests/operations/test_workload_admission_script.py
          tests/operations/test_wu_token_repository_scan.py
          tests/test_quarantine_registry.py
          --junitxml=$RUNNER_TEMP/linux-junit.xml

      - name: Upload JUnit Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-junit-audit-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-junit.xml
          if-no-files-found: error
          retention-days: 30

  test:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Do NOT set lfs: true. The hgb model artifacts are ~382 MB and every
          # checkout of them is metered against the account's LFS bandwidth
          # quota (1 GB/month included); this workflow alone exhausted it.
          # The test suite stubs these artifacts and does not read their bytes.
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[test]"

      # Ratchets already ran in the `audit` job and the memory-flatness tests
      # run in the parallel `memory-flatness` job;
      # tests/operations/test_ci_job_partition.py and
      # tests/operations/test_ci_ratchet_selection.py prove the three
      # selections partition the suite (no test dropped, none run twice).
      - name: Run Test Suite
        run: python -m pytest -q -m "not ratchet and not memory_flatness" --junitxml=$RUNNER_TEMP/linux-junit.xml

      # Per-test timings for suite review and shard balancing (same artifact
      # contract as PR #197). Uploaded even when tests fail.
      - name: Upload JUnit Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-junit-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-junit.xml
          if-no-files-found: error
          retention-days: 30

  # The slow 5-to-50-run tracemalloc flatness tests (~45% of the suite's
  # Linux time) run beside the `test` job on the same Python and dependencies.
  memory-flatness:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # LFS stays off for the same reason as the `test` job.
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[test]"

      - name: Run Memory-Flatness Tests
        run: python -m pytest -q -m "memory_flatness and not ratchet" --junitxml=$RUNNER_TEMP/linux-junit.xml

      - name: Upload JUnit Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-junit-memory-flatness-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-junit.xml
          if-no-files-found: error
          retention-days: 30
