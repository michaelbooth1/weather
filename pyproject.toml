[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-market"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib==3.10.9",
    "netCDF4==1.7.4",
    "numpy==2.4.6",
    "pandas==3.0.3",
    "requests==2.34.2",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "streamlit==1.57.0",
    "websocket-client==1.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
